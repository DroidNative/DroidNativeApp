<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- /etc/droidnative/dbus-session.conf, installed by DroidNative.
     The stock session bus plus anonymous authentication: under proot every
     process claims uid 0 while the kernel reports the app's real uid in
     socket credentials, so EXTERNAL authentication is rejected. All guest
     processes belong to the same Android app, there is nobody to keep out. -->
<busconfig>
  <include>/usr/share/dbus-1/session.conf</include>
  <auth>EXTERNAL</auth>
  <auth>ANONYMOUS</auth>
  <allow_anonymous/>
</busconfig>
